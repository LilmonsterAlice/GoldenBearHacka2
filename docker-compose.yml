services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    environment:
      ANALYSIS_MODE: "${ANALYSIS_MODE:-real}"
      ANALYSIS_PATH: "/snapshot/analysis.json"
      CHAT_SERVICE: "backend.services.llm:answer_chat"
      FEATHERLESS_API_KEY: "${FEATHERLESS_API_KEY:-}"
      FEATHERLESS_BASE_URL: "${FEATHERLESS_BASE_URL:-https://api.featherless.ai/v1}"
      FEATHERLESS_MODEL: "${FEATHERLESS_MODEL:-Qwen/Qwen2.5-7B-Instruct}"
      FEATHERLESS_TIMEOUT_SECONDS: "${FEATHERLESS_TIMEOUT_SECONDS:-20}"
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: "${ANALYSIS_HOST_PATH:-./generated/analysis.json}"
        target: /snapshot/analysis.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8001/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: "http://backend:8001"
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:3000/_stcore/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
